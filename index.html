<!doctype html>
<!-- The fixed link for friends (owner 2026-10-16: a link that never changes, free). Hosted on GitHub Pages;
     scripts/online.mjs writes the current trycloudflare link into link.txt and pushes it on every start. -->
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windspire</title>
<style>
  :root { --bg: #0f1a2b; --fg: #eaf2ff; --dim: #8fa3c0; --acc: #ffd76b; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, "Noto Sans Thai", sans-serif; text-align: center; padding: 0 16px; box-sizing: border-box; }
  h1 { font-size: 2rem; margin: 0 0 .3em; letter-spacing: .05em; }
  p { margin: .4em 0; color: var(--dim); }
  a { color: var(--acc); }
  #help { display: none; }
</style>
</head>
<body>
<main>
  <h1>Windspire</h1>
  <p id="msg">กำลังพาไปเกม…</p>
  <p id="help">ถ้ายังไม่เข้าเกม: <a id="go" href="#">กดตรงนี้</a><br>ถ้ายังเข้าไม่ได้ เซิร์ฟเวอร์อาจปิดอยู่ ลองใหม่ภายหลัง</p>
</main>
<script>
  // #admin → the admin page, anything else → the game's home page
  const path = location.hash.length > 1 ? "/" + location.hash.slice(1) : "/";
  const go = url => {
    const to = url.replace(/\/$/, "") + path;
    document.getElementById("go").href = to;
    location.replace(to);
    setTimeout(() => { document.getElementById("help").style.display = "block"; }, 6000);
  };
  fetch("link.txt?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.text() : Promise.reject())
    .then(t => { const u = t.trim(); if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(u)) throw 0; go(u); })
    .catch(() => { document.getElementById("msg").textContent = "เซิร์ฟเวอร์ยังไม่เปิด ลองใหม่ภายหลัง"; });
</script>
</body>
</html>
